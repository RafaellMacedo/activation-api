spring:
  application:
    name: activation-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/activation_db}
    username: ${DB_USERNAME:activation_user}
    password: ${DB_PASSWORD:activation_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true