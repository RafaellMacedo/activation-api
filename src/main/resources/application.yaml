spring:
  application:
    name: activation-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/activation_db}
    username: ${DB_USERNAME:activation_user}
    password: ${DB_PASSWORD:activation_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    issuer: ${JWT_ISSUER:http://localhost:9000}
    audience: ${JWT_AUDIENCE:activation-api}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

  provider:
    base-url: ${PROVIDER_BASE_URL:http://localhost:9090}
    connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROVIDER_READ_TIMEOUT:5s}
    api-key: ${PROVIDER_API_KEY:}
  
  processing:
    max-attempts: ${PROCESSING_MAX_ATTEMPTS:3}
    initial-backoff: ${PROCESSING_INITIAL_BACKOFF:2s}
    max-backoff: ${PROCESSING_MAX_BACKOFF:1m}
    enabled: ${PROCESSING_ENABLED:false}
    poll-delay: ${PROCESSING_POLL_DELAY:1000}